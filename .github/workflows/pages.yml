name: Publier Grain de Beauté sur GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publication relue et autorisée
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publication == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify the public site files
        run: |
          test -s public/index.html
          test -s public/galerie.html
          test -s public/style.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the public website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
